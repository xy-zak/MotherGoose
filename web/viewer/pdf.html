<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF · MotherGoose</title>
<link rel="stylesheet" href="/_mg/theme.css">
<link rel="stylesheet" href="/_mg/vendor/pdfjs-4.10.38/web/pdf_viewer.css">
<link rel="stylesheet" href="/_mg/viewer/viewer.css">
<script src="/_mg/prefs.js"></script>
<script src="/_mg/tips.js" defer></script>
</head>
<body class="viewer">
  <!-- PDF.js's viewer needs an absolutely positioned scroll container (div) holding a .pdfViewer div. -->
  <div id="pages" class="pages" role="main" tabindex="0" aria-label="PDF pages"><div id="viewer" class="pdfViewer"></div></div>
  <!-- Floating, so the player shell keeps just its two slim bars at the top. -->
  <div class="vtools compact pdf" role="toolbar" aria-label="PDF controls">
    <span class="vname"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#kind-pdf"></use></svg><span id="name"></span></span>
    <span class="vsync" id="sync" hidden></span>
    <button class="mg-btn quiet small" id="prev" type="button" title="Previous page (p)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#prev"></use></svg><span class="lbl">previous</span></button>
    <input class="mg-input page" id="page" inputmode="numeric" aria-label="Page number" value="1">
    <span class="mg-muted">/&nbsp;<span id="count">–</span></span>
    <button class="mg-btn quiet small" id="next" type="button" title="Next page (n)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#next"></use></svg><span class="lbl">next</span></button>
    <span class="vsep"></span>
    <button class="mg-btn quiet small" id="out" type="button" title="Zoom out (−)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#zoom-out"></use></svg><span class="lbl">zoom out</span></button>
    <span class="zoom" id="zoom">–</span>
    <button class="mg-btn quiet small" id="in" type="button" title="Zoom in (+)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#zoom-in"></use></svg><span class="lbl">zoom in</span></button>
    <button class="mg-btn small" id="fit" type="button" aria-pressed="true" title="Fit to width (0)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#fit"></use></svg><span class="lbl">fit</span></button>
    <span class="vsep" data-forms hidden></span>
    <button class="mg-btn quiet small" id="export" type="button" data-forms hidden title="Download this PDF with the entries filled in (e)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#export"></use></svg><span class="lbl">export filled</span></button>
  </div>
  <div id="note" class="vnote" role="status" hidden><svg class="mg-i" aria-hidden="true"><use id="noteIcon" href="/_mg/icons.svg#info"></use></svg><span id="noteText"></span><button class="mg-btn quiet small" id="noteClose" type="button" aria-label="Close" title="Close"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#close"></use></svg></button></div>
  <p id="error" class="verror" hidden></p>
  <script src="/_mg/sync.js"></script>
  <script type="module" src="/_mg/viewer/pdf.js"></script>
</body>
</html>
