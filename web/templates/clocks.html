<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mothergoose" content="theme">
<title>Clocks</title>
<style>
  /* MotherGoose look: its theme's tokens when MotherGoose serves the page,
     Catppuccin Latte / Mocha when the page is opened on its own. */
  :root {
    --bg: #eff1f5; --bar: #e6e9ef; --deep: #dce0e8; --surface: #ccd0da; --line: #bcc0cc; --line-strong: #acb0be;
    --text: #4c4f69; --muted: #6c6f85; --accent: #8839ef; --on-accent: #eff1f5;
    --players: #1e66f5; --referee: #fe640b; --live: #40a02b; --warn: #df8e1d; --danger: #d20f39;
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --fs-title: 14px; --fs-body: 13px; --fs-small: 11.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e; --bar: #181825; --deep: #11111b; --surface: #313244; --line: #45475a; --line-strong: #585b70;
      --text: #cdd6f4; --muted: #a6adc8; --accent: #cba6f7; --on-accent: #11111b;
      --players: #89b4fa; --referee: #fab387; --live: #a6e3a1; --warn: #f9e2af; --danger: #f38ba8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
  .page { max-width: 900px; margin: 0 auto; padding: 14px 14px 40px; display: grid; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .head .grow { flex: 1 1 220px; }
  .big { font-size: calc(var(--fs-title) + 6px); font-weight: 700; width: 100%; }
  /* Panels: a 1px box with its title sitting on the top line. */
  .panel { position: relative; border: 1px solid var(--line); padding: 16px 10px 10px; }
  .panel > .t {
    position: absolute; top: -.75em; left: 8px; padding: 0 6px; background: var(--bg);
    font-size: var(--fs-small); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 150px), 1fr)); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-small); }
  label.f { display: grid; gap: 3px; }
  label.f > span { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--deep);
    border: 1px solid var(--line); border-radius: 0; padding: 4px 6px; min-width: 0;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
  textarea { width: 100%; min-height: 6em; resize: vertical; line-height: 1.5; }
  input[type=number] { text-align: center; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  input:focus, textarea:focus, select:focus, [contenteditable]:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 0; padding: 3px 10px; cursor: pointer; min-height: 26px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  button.quiet { background: none; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: left; padding: 0 4px 4px; }
  td { padding: 2px; }
  td input { width: 100%; }
  /* Touch screens: everything you tap is 40px or more, text a step bigger,
     and fields at 16px or more so iOS doesn't zoom in. */
  @media (pointer: coarse) {
    :root { --fs-title: 16px; --fs-body: 15px; --fs-small: 13px; }
    button { min-height: 40px; min-width: 40px; touch-action: manipulation; }
    input, select, textarea { font-size: max(16px, 1em); }
    input:not([type=checkbox]):not([type=radio]), select { min-height: 40px; }
    input[type=checkbox], input[type=radio] { width: 22px; height: 22px; }
    td { padding: 3px 2px; }
  }
  /* Reduced or no motion, as chosen in MotherGoose's Display settings. */
  :root[data-anim="off"] *, :root[data-anim="reduced"] * { transition: none !important; animation: none !important; }
  .clocks { --min: 180px; }
  .clock { display: grid; justify-items: center; gap: 6px; padding: 10px 8px; border: 1px solid var(--line); background: var(--bar); }
  .clock input.lbl { width: 100%; text-align: center; font-weight: 700; background: none; border-color: transparent; }
  .clock input.lbl:focus { border-color: var(--accent); }
  .clock svg { width: 120px; height: 120px; cursor: pointer; touch-action: manipulation; }
  .clock svg path { fill: var(--deep); stroke: var(--line-strong); stroke-width: 1.5; transition: fill .15s; }
  .clock svg path.on { fill: var(--accent); }
  .clock svg path:hover { stroke: var(--accent); }
  .clock .meta { display: flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--muted); }
  .clock select { padding: 1px 4px; }
  .timer { display: grid; justify-items: center; gap: 10px; padding: 8px; }
  .timer .left { font-size: 44px; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .timer .left.done { color: var(--danger); }
  .timer .left.run { color: var(--accent); }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="grow"><input class="big" id="title" value="Clocks" aria-label="Title"></div>
  </header>

  <section class="panel"><span class="t">Progress clocks</span>
    <div class="grid clocks" id="clocks"></div>
    <p class="small muted" style="margin:8px 0 0">Tap a segment to fill the clock up to it; tap the last filled one to empty it. Name each clock: a threat closing in, a project, a ritual…</p>
  </section>

  <section class="panel"><span class="t">Countdown</span>
    <div class="timer">
      <div class="left" id="left" aria-live="polite">05:00</div>
      <div class="row">
        <label class="f"><span>Minutes</span><input id="timer-min" type="number" min="0" max="600" value="5" style="width:6em"></label>
        <button type="button" class="primary" id="go">start</button>
        <button type="button" id="reset">reset</button>
      </div>
    </div>
  </section>
</main>
<script>
  // A clock's name and size are fields; how full it is, and the countdown,
  // are kept with MotherGoose.set so every device shows the same.
  var CLOCKS = 6, SVGNS = 'http://www.w3.org/2000/svg';
  (function () {
    var box = document.getElementById('clocks');
    for (var i = 1; i <= CLOCKS; i++) {
      var d = document.createElement('div');
      d.className = 'clock';
      d.dataset.clock = i;
      d.innerHTML = '<input class="lbl" id="k' + i + '-label" placeholder="clock ' + i + '" aria-label="Clock ' + i + ' name">' +
        '<svg viewBox="-52 -52 104 104" role="img" aria-label="Clock ' + i + '"></svg>' +
        '<span class="meta"><span class="fill">0</span> of <select id="k' + i + '-size" aria-label="Segments">' +
        [4, 6, 8, 10, 12].map(function (n) { return '<option' + (n === 6 ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></span>';
      box.appendChild(d);
    }
  })();

  document.addEventListener('DOMContentLoaded', function () {
    var mg = window.MotherGoose;
    var fill = {};
    function size(i) { return +document.getElementById('k' + i + '-size').value || 6; }
    function draw(i) {
      var box = document.querySelector('[data-clock="' + i + '"]'), svg = box.querySelector('svg');
      var n = size(i), f = Math.min(fill[i] || 0, n);
      svg.textContent = '';
      for (var s = 0; s < n; s++) {
        var a0 = (s / n) * 2 * Math.PI - Math.PI / 2, a1 = ((s + 1) / n) * 2 * Math.PI - Math.PI / 2;
        var p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', 'M0 0 L' + 48 * Math.cos(a0) + ' ' + 48 * Math.sin(a0) + ' A48 48 0 0 1 ' + 48 * Math.cos(a1) + ' ' + 48 * Math.sin(a1) + ' Z');
        if (s < f) p.setAttribute('class', 'on');
        p.dataset.seg = s + 1;
        svg.appendChild(p);
      }
      box.querySelector('.fill').textContent = f;
    }
    for (var i = 1; i <= CLOCKS; i++) {
      (function (i) {
        fill[i] = (mg && mg.get('k' + i)) || 0;
        var box = document.querySelector('[data-clock="' + i + '"]');
        box.querySelector('svg').addEventListener('click', function (e) {
          var seg = e.target.dataset && +e.target.dataset.seg;
          if (!seg) return;
          fill[i] = fill[i] === seg ? seg - 1 : seg;
          if (mg) mg.set('k' + i, fill[i]);
          draw(i);
        });
        document.getElementById('k' + i + '-size').addEventListener('change', function () { draw(i); });
        if (mg) mg.on('k' + i, function (v) { fill[i] = v || 0; draw(i); });
        draw(i);
      })(i);
    }

    // The countdown: { running, endsAt } while running, { left } when paused.
    var t = (mg && mg.get('timer')) || null, tick = 0;
    var left = document.getElementById('left'), go = document.getElementById('go'), mins = document.getElementById('timer-min');
    function full() { return Math.max(0, (parseFloat(mins.value) || 0) * 60000); }
    function remaining() { return !t ? full() : t.running ? Math.max(0, t.endsAt - Date.now()) : t.left; }
    function show() {
      var ms = remaining(), s = Math.ceil(ms / 1000);
      left.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      left.className = 'left' + (t && t.running ? ' run' : '') + (ms === 0 && t ? ' done' : '');
      go.textContent = t && t.running ? 'pause' : 'start';
      clearTimeout(tick);
      if (t && t.running && ms > 0) tick = setTimeout(show, 250);
    }
    function save() { if (mg) mg.set('timer', t); show(); }
    go.addEventListener('click', function () {
      if (t && t.running) t = { running: false, left: remaining() };
      else t = { running: true, endsAt: Date.now() + (t ? t.left : full()) };
      save();
    });
    document.getElementById('reset').addEventListener('click', function () { t = null; save(); });
    mins.addEventListener('input', show);
    if (mg) mg.on('timer', function (v) { t = v || null; show(); });
    show();
  });
</script>
</body>
</html>
