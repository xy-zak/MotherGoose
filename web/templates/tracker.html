<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mothergoose" content="theme">
<title>Tracker</title>
<style>
  /* MotherGoose look: its theme's tokens when MotherGoose serves the page,
     Catppuccin Latte / Mocha when the page is opened on its own. */
  :root {
    --bg: #eff1f5; --bar: #e6e9ef; --deep: #dce0e8; --surface: #ccd0da; --line: #bcc0cc; --line-strong: #acb0be;
    --text: #4c4f69; --muted: #6c6f85; --accent: #8839ef; --on-accent: #eff1f5;
    --players: #1e66f5; --referee: #fe640b; --live: #40a02b; --warn: #df8e1d; --danger: #d20f39;
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --fs-title: 14px; --fs-body: 13px; --fs-small: 11.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e; --bar: #181825; --deep: #11111b; --surface: #313244; --line: #45475a; --line-strong: #585b70;
      --text: #cdd6f4; --muted: #a6adc8; --accent: #cba6f7; --on-accent: #11111b;
      --players: #89b4fa; --referee: #fab387; --live: #a6e3a1; --warn: #f9e2af; --danger: #f38ba8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
  .page { max-width: 900px; margin: 0 auto; padding: 14px 14px 40px; display: grid; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .head .grow { flex: 1 1 220px; }
  .big { font-size: calc(var(--fs-title) + 6px); font-weight: 700; width: 100%; }
  /* Panels: a 1px box with its title sitting on the top line. */
  .panel { position: relative; border: 1px solid var(--line); padding: 16px 10px 10px; }
  .panel > .t {
    position: absolute; top: -.75em; left: 8px; padding: 0 6px; background: var(--bg);
    font-size: var(--fs-small); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 150px), 1fr)); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-small); }
  label.f { display: grid; gap: 3px; }
  label.f > span { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--deep);
    border: 1px solid var(--line); border-radius: 0; padding: 4px 6px; min-width: 0;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
  textarea { width: 100%; min-height: 6em; resize: vertical; line-height: 1.5; }
  input[type=number] { text-align: center; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  input:focus, textarea:focus, select:focus, [contenteditable]:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 0; padding: 3px 10px; cursor: pointer; min-height: 26px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  button.quiet { background: none; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: left; padding: 0 4px 4px; }
  td { padding: 2px; }
  td input { width: 100%; }
  /* Touch screens: everything you tap is 40px or more, text a step bigger,
     and fields at 16px or more so iOS doesn't zoom in. */
  @media (pointer: coarse) {
    :root { --fs-title: 16px; --fs-body: 15px; --fs-small: 13px; }
    button { min-height: 40px; min-width: 40px; touch-action: manipulation; }
    input, select, textarea { font-size: max(16px, 1em); }
    input:not([type=checkbox]):not([type=radio]), select { min-height: 40px; }
    input[type=checkbox], input[type=radio] { width: 22px; height: 22px; }
    td { padding: 3px 2px; }
  }
  /* Reduced or no motion, as chosen in MotherGoose's Display settings. */
  :root[data-anim="off"] *, :root[data-anim="reduced"] * { transition: none !important; animation: none !important; }
  .counters { --min: 190px; }
  .counter { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); background: var(--bar); }
  .counter input.lbl { font-weight: 700; text-align: center; background: none; border-color: transparent; }
  .counter input.lbl:focus { border-color: var(--accent); }
  .counter .n { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 4px; }
  .counter .n input { font-size: calc(var(--fs-title) + 12px); font-weight: 700; padding: 2px; }
  .counter .n button { font-size: 18px; font-weight: 700; padding: 0; }
  .conds { display: flex; flex-wrap: wrap; gap: 6px; }
  .cond { padding: 4px 10px; background: var(--deep); }
  .cond[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 26%, var(--bg)); border-color: var(--accent); font-weight: 700; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: var(--fs-small); }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="grow"><input class="big" id="title" placeholder="Tracker" aria-label="Whose tracker"></div>
    <button type="button" class="quiet" id="reset-all" data-mg-ignore title="Put every counter back to 0 and clear the conditions">reset all</button>
  </header>

  <section class="panel"><span class="t">Counters</span>
    <div class="grid counters" id="counters"></div>
  </section>

  <section class="panel"><span class="t">Conditions</span>
    <div class="conds" id="conds" role="group" aria-label="Conditions: tap to switch on or off"></div>
    <details>
      <summary>change the list of conditions</summary>
      <p class="small muted">One per line. Everyone with this page open sees the new list.</p>
    <textarea id="condition-list" style="min-height:7em" aria-label="Conditions, one per line">Hidden
Hurt
Stunned
Frightened
Inspired
Blessed
Poisoned
Exhausted</textarea>
    </details>
  </section>
</main>
<script>
  // Counters are plain number fields (with − and +), so they save and sync
  // like any field. Conditions are kept with MotherGoose.set: a list of the
  // ones switched on, shared by every device.
  var LABELS = ['Health', 'Armour', 'Ammo', 'Coins', 'Torches', 'Rations'];
  (function () {
    var box = document.getElementById('counters');
    LABELS.forEach(function (name, i) {
      var n = i + 1, d = document.createElement('div');
      d.className = 'counter';
      d.innerHTML = '<input class="lbl" id="c' + n + '-label" value="' + name + '" aria-label="Counter ' + n + ' name">' +
        '<div class="n"><button type="button" data-step="-1" aria-label="One less">−</button>' +
        '<input id="c' + n + '" type="number" value="0" aria-label="Counter ' + n + '">' +
        '<button type="button" data-step="1" aria-label="One more">+</button></div>';
      box.appendChild(d);
    });
  })();

  function bump(input, by) {
    input.value = (parseFloat(input.value) || 0) + by;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }
  document.getElementById('counters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-step]');
    if (b) bump(b.parentElement.querySelector('input'), Number(b.dataset.step));
  });

  document.addEventListener('DOMContentLoaded', function () {
    var mg = window.MotherGoose;
    var list = document.getElementById('condition-list');
    var conds = document.getElementById('conds');
    var on = (mg && mg.get('conditions')) || [];
    function names() { return list.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean); }
    function draw() {
      conds.textContent = '';
      names().forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cond';
        b.textContent = name;            // never innerHTML: names come from any device
        b.setAttribute('aria-pressed', String(on.indexOf(name) >= 0));
        b.addEventListener('click', function () {
          on = on.indexOf(name) >= 0 ? on.filter(function (x) { return x !== name; }) : on.concat([name]);
          if (mg) mg.set('conditions', on);
          draw();
        });
        conds.appendChild(b);
      });
    }
    list.addEventListener('input', draw);
    if (mg) mg.on('conditions', function (v) { on = Array.isArray(v) ? v : []; draw(); });
    document.getElementById('reset-all').addEventListener('click', function () {
      document.querySelectorAll('#counters input[type=number]').forEach(function (i) { bump(i, -(parseFloat(i.value) || 0)); });
      on = [];
      if (mg) mg.set('conditions', on);
      draw();
    });
    draw();
  });
</script>
</body>
</html>
