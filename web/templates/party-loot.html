<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mothergoose" content="theme">
<title>Party loot</title>
<style>
  /* MotherGoose look: its theme's tokens when MotherGoose serves the page,
     Catppuccin Latte / Mocha when the page is opened on its own. */
  :root {
    --bg: #eff1f5; --bar: #e6e9ef; --deep: #dce0e8; --surface: #ccd0da; --line: #bcc0cc; --line-strong: #acb0be;
    --text: #4c4f69; --muted: #6c6f85; --accent: #8839ef; --on-accent: #eff1f5;
    --players: #1e66f5; --referee: #fe640b; --live: #40a02b; --warn: #df8e1d; --danger: #d20f39;
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --fs-title: 14px; --fs-body: 13px; --fs-small: 11.5px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e; --bar: #181825; --deep: #11111b; --surface: #313244; --line: #45475a; --line-strong: #585b70;
      --text: #cdd6f4; --muted: #a6adc8; --accent: #cba6f7; --on-accent: #11111b;
      --players: #89b4fa; --referee: #fab387; --live: #a6e3a1; --warn: #f9e2af; --danger: #f38ba8;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
  .page { max-width: 900px; margin: 0 auto; padding: 14px 14px 40px; display: grid; gap: 14px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .head .grow { flex: 1 1 220px; }
  .big { font-size: calc(var(--fs-title) + 6px); font-weight: 700; width: 100%; }
  /* Panels: a 1px box with its title sitting on the top line. */
  .panel { position: relative; border: 1px solid var(--line); padding: 16px 10px 10px; }
  .panel > .t {
    position: absolute; top: -.75em; left: 8px; padding: 0 6px; background: var(--bg);
    font-size: var(--fs-small); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 150px), 1fr)); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .muted { color: var(--muted); }
  .small { font-size: var(--fs-small); }
  label.f { display: grid; gap: 3px; }
  label.f > span { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--deep);
    border: 1px solid var(--line); border-radius: 0; padding: 4px 6px; min-width: 0;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
  textarea { width: 100%; min-height: 6em; resize: vertical; line-height: 1.5; }
  input[type=number] { text-align: center; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  input:focus, textarea:focus, select:focus, [contenteditable]:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 0; padding: 3px 10px; cursor: pointer; min-height: 26px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  button.quiet { background: none; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: var(--fs-small); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: left; padding: 0 4px 4px; }
  td { padding: 2px; }
  td input { width: 100%; }
  .money { --min: 150px; }
  .coin { display: grid; gap: 4px; padding: 6px; border: 1px solid var(--line); background: var(--bar); }
  .coin input.lbl { background: none; border-color: transparent; font-size: var(--fs-small); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: center; }
  .coin input.lbl:focus { border-color: var(--accent); }
  .coin input.val { font-size: calc(var(--fs-title) + 8px); font-weight: 700; }
  #items td:nth-child(2) input { width: 4.5em; }
  #items td:nth-child(3) input { width: 9em; }
  .total { font-weight: 700; }
  @media (max-width: 560px) { #items td:nth-child(4), #items th:nth-child(4) { display: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div class="grow"><input class="big" id="title" value="Party loot" aria-label="Title"></div>
    <span class="small muted">Everything the party carries, shared.</span>
  </header>

  <section class="panel"><span class="t">Money</span>
    <div class="grid money">
      <div class="coin"><input class="lbl" id="cur1-label" value="Gold" aria-label="Currency 1"><input class="val" id="cur1" type="number" value="0" aria-label="Amount 1"></div>
      <div class="coin"><input class="lbl" id="cur2-label" value="Silver" aria-label="Currency 2"><input class="val" id="cur2" type="number" value="0" aria-label="Amount 2"></div>
      <div class="coin"><input class="lbl" id="cur3-label" value="Copper" aria-label="Currency 3"><input class="val" id="cur3" type="number" value="0" aria-label="Amount 3"></div>
      <div class="coin"><input class="lbl" id="cur4-label" value="Gems" aria-label="Currency 4"><input class="val" id="cur4" type="number" value="0" aria-label="Amount 4"></div>
    </div>
  </section>

  <section class="panel"><span class="t">Items</span>
    <table id="items"><thead><tr><th>Item</th><th>Qty</th><th>Carried by</th><th>Notes</th></tr></thead><tbody></tbody></table>
    <p class="small muted" style="margin:8px 0 0"><span class="total" id="count">0</span> items listed.</p>
  </section>

  <section class="panel"><span class="t">Owed, promised, to sell</span>
    <textarea id="loot-notes" placeholder="Debts, rewards still to collect, things to sell in town…"></textarea>
  </section>
</main>
<script>
  var ITEMS = 20;
  (function () {
    var body = document.querySelector('#items tbody');
    for (var i = 1; i <= ITEMS; i++) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><input id="item' + i + '" aria-label="Item ' + i + '"></td>' +
        '<td><input id="item' + i + '-qty" type="number" min="0" aria-label="Quantity ' + i + '"></td>' +
        '<td><input id="item' + i + '-who" aria-label="Carried by ' + i + '"></td>' +
        '<td><input id="item' + i + '-note" aria-label="Notes ' + i + '"></td>';
      body.appendChild(tr);
    }
  })();
  document.addEventListener('DOMContentLoaded', function () {
    function count() {
      var n = 0;
      for (var i = 1; i <= ITEMS; i++) {
        if (document.getElementById('item' + i).value.trim()) n += parseFloat(document.getElementById('item' + i + '-qty').value) || 1;
      }
      document.getElementById('count').textContent = n;
    }
    document.getElementById('items').addEventListener('input', count);
    count();
  });
</script>
</body>
</html>
