<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MotherGoose</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231e1e2e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='15' fill='%23cba6f7' text-anchor='middle'%3EMG%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/_mg/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/_mg/theme.css">
<link rel="stylesheet" href="/_mg/shell/shell.css">
<script src="/_mg/prefs.js"></script>
<script src="/_mg/tips.js" defer></script>
</head>
<body>
  <header class="mg-bar mg-head info" id="info">
    <a class="mg-brand" href="/" title="MotherGoose">MOTHERGOOSE</a>
    <span class="mg-seg where players hide-sm" id="where"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#players"></use></svg><span>player dashboard</span><span id="meName" hidden></span></span>
    <button class="mg-btn players whoami" id="whoBtn" type="button" hidden></button>
    <button class="mg-seg session" id="sessionBtn" type="button" title="Session details (i)">
      <span class="label" id="sessionName">no session</span><span id="sessionGame" class="hide-sm"></span>
    </button>
    <button class="mg-btn mg-state warn" id="syncBtn" type="button" title="Connection details (i)"><span id="syncLabel">connecting</span></button>
    <span class="mg-grow"></span>
    <span class="mg-actions">
      <a class="mg-btn referee" id="adminLink" href="/admin" data-switch="referee" hidden title="The referee's dashboard (this computer only)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#view"></use></svg><span class="lbl">referee's dashboard</span></a>
      <button class="mg-btn" data-prefs type="button" title="Display settings: theme, font, icons"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#settings"></use></svg><span class="lbl hide-sm">display</span></button>
      <button class="mg-btn" id="helpBtn" type="button" title="Help: keyboard shortcuts and the player tutorial (?)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#help"></use></svg><span class="lbl hide-sm">help</span></button>
    </span>
  </header>
  <nav class="tabbar" aria-label="Session pages">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="bar-btn" id="fullBtn" type="button" title="Full screen (f)"></button>
  </nav>

  <main id="stage" hidden>
    <div class="pick" id="pick" role="tablist" aria-label="Whose copy" hidden></div>
    <div id="frames">
      <section id="who" class="who" hidden>
        <div class="mg-notice mg-panel players">
          <div class="mg-panel-title"><span class="t"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#player"></use></svg><span id="whoEyebrow">per player</span></span></div>
          <h1 id="whoTitle">Who are you?</h1>
          <p class="mg-muted" id="whoText"></p>
          <div id="whoRoster"></div>
        </div>
      </section>
    </div>
  </main>

  <section id="empty" class="mg-center" hidden>
    <div class="mg-notice mg-panel">
      <div class="mg-panel-title"><span class="t" id="emptyEyebrow">waiting</span></div>
      <h1 id="emptyTitle">The referee hasn't opened a session yet.</h1>
      <p class="mg-muted" id="emptyText">Keep this page open. It will update by itself when the session starts.</p>
    </div>
  </section>

  <script type="module" src="/_mg/shell/shell.js"></script>
</body>
</html>
