<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotherGoose Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231e1e2e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='15' fill='%23cba6f7' text-anchor='middle'%3EMG%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/_mg/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/_mg/theme.css">
<link rel="stylesheet" href="/_mg/admin/admin.css">
<script src="/_mg/prefs.js"></script>
<script src="/_mg/tips.js" defer></script>
</head>
<body>
  <header class="mg-bar mg-head top">
    <a class="mg-brand" href="#/" title="MotherGoose">MOTHERGOOSE</a>
    <span class="mg-seg where referee hide-sm"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#referee"></use></svg><span>referee's dashboard</span></span>
    <span class="mg-seg mg-state err" id="serverState" hidden>OFFLINE</span>
    <span class="mg-grow"></span>
    <span class="mg-actions">
      <button class="mg-btn" type="button" data-act="join" title="Address and QR code for players (j)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#join"></use></svg><span class="lbl">Join Info</span></button>
      <button class="mg-btn hide-sm" type="button" data-act="data" title="Where everything is stored"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#data"></use></svg><span class="lbl">data folder</span></button>
      <a class="mg-btn players" href="/" target="_blank" rel="noopener" data-switch="players" title="The player dashboard: what players see (opens a new tab)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#view"></use></svg><span class="lbl">player view</span></a>
      <button class="mg-btn" data-prefs type="button" title="Display settings: theme, font, icons"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#settings"></use></svg><span class="lbl hide-sm">display</span></button>
      <button class="mg-btn" type="button" data-act="help" title="Help: keyboard shortcuts and the referee tutorial (?)"><svg class="mg-i" aria-hidden="true"><use href="/_mg/icons.svg#help"></use></svg><span class="lbl hide-sm">help</span></button>
    </span>
  </header>
  <main class="layout" id="app">
    <aside class="pane" id="left"></aside>
    <section class="pane" id="right"></section>
  </main>
  <input type="file" id="picker" accept=".html,.htm,.pdf,.png,.jpg,.jpeg,text/html,application/pdf,image/png,image/jpeg" multiple hidden>
  <script type="module" src="/_mg/admin/admin.js"></script>
</body>
</html>
